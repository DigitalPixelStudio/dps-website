<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Digital Pixel Studio</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<nav class="navbar" id="navbar">
  <div class="container">
    <a href="index.html" class="logo">
      <span class="logo-text"><span class="neon-text">DIGITAL</span> <span class="gold">PIXEL</span> <span class="logo-studio">STUDIO</span></span>
      <span class="neon-dot" style="background:var(--neon-red);box-shadow:0 0 10px var(--neon-red);"></span>
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#services">Services</a></li>
      <li><a href="index.html#portfolio">Portfolio</a></li>
      <li><a href="index.html#contact">Contact</a></li>
      <li><a href="login.html" class="btn btn-primary"><i class="fas fa-user"></i> Login</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<section class="auth-page">
  <div class="auth-box" id="loginBox">
    <h2><span class="neon-text">Welcome</span> <span class="gold">Back</span></h2>
    <p>Sign in to your Digital Pixel Studio account</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" required placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" required placeholder="Enter password" minlength="6">
      </div>
      <button type="submit" class="btn btn-primary"><i class="fas fa-sign-in-alt"></i> Sign In</button>
    </form>
    <p class="auth-switch">Don't have an account? <a href="#" id="showRegister">Register here</a></p>
  </div>

  <div class="auth-box" id="registerBox" style="display:none;">
    <h2><span class="neon-text">Create</span> <span class="gold">Account</span></h2>
    <p>Register to track your projects and manage your account</p>
    <form id="registerForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="regName" required placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="regEmail" required placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="regPhone" required placeholder="+91 9876543210">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" required placeholder="Min 6 characters" minlength="6">
      </div>
      <button type="submit" class="btn btn-primary"><i class="fas fa-user-plus"></i> Create Account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="#" id="showLogin">Sign in</a></p>
  </div>
</section>

<script src="js/auth.js"></script>
</body>
</html>
